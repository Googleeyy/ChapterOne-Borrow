# SonarQube configuration for ChapterOne Borrow Service
# This file configures SonarQube analysis for the project

# Project identification
sonar.projectKey=chapterone-borrow-service
sonar.projectName=ChapterOne Borrow Service
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=src/main/java
sonar.tests=src/test/java

# Source code encoding
sonar.sourceEncoding=UTF-8

# Java configuration
sonar.java.source=17
sonar.java.target=17

# Exclusions
sonar.exclusions=**/target/**,**/build/**,**/node_modules/**,**/*.jar,**/*.class
sonar.test.exclusions=**/target/**,**/build/**

# Coverage configuration (JaCoCo)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.java.coveragePlugin=jacoco

# Code quality thresholds
sonar.qualitygate.wait=true

# Scanner for Maven will automatically pick up these settings
# Additional properties can be set via environment variables or CI/CD pipeline
